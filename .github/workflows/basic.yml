name: basic

on:
  push:
    branches: ["main", "ng"]
  # every pull request, stacked ones included
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        toolchain:
          - stable
          - nightly
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{matrix.os}}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{matrix.toolchain}}

      - uses: taiki-e/install-action@cargo-hack

      - name: Show version
        run: cargo version

      # Every representation and family can be disabled: check each one
      # alone and every pair of features (the full powerset is too large).
      - name: Check (features alone and in pairs)
        env:
          RUSTFLAGS: "-D warnings"
        run: >-
          cargo hack check -v --lib --no-dev-deps --feature-powerset --depth 2
          --exclude-features unstable,loom

      - name: Build
        run: cargo hack build -v --each-feature

      # The test suite needs the default families and representations.
      - name: Run tests
        run: |
          cargo test -v -- --nocapture
          cargo test -v --all-features -- --nocapture

      - name: Run tests (release)
        run: |
          cargo test -v --release -- --nocapture
          cargo test -v --release --all-features -- --nocapture

      - name: Run loom tests
        env:
          RUSTFLAGS: "--cfg loom"
        run: cargo test -v --release --all-features loom -- --nocapture

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check documentation (all-features)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items --all-features

  msrv:
    runs-on: ubuntu-latest

    env:
      rust_version: ""

    steps:
      - uses: actions/checkout@v4

      - name: Get MSRV from Cargo
        run: |
          rust_version=$(grep rust-version Cargo.toml | cut -d'"' -f2)
          echo "rust_version=$rust_version" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust_version }}

      - name: Build
        run: cargo build --verbose --release --all-features

      - name: Run tests
        run: cargo test --verbose --release --all-features -- --nocapture

  minimal-versions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-hack
      - uses: taiki-e/install-action@cargo-minimal-versions

      - name: Check with minimal versions
        run: cargo minimal-versions check

      - name: Check with minimal versions (all-features)
        run: cargo minimal-versions check --all-features

      - name: Check with minimal versions (serde only)
        run: cargo minimal-versions check --no-default-features -F serde

  no_std:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@cargo-binstall

      - name: Install cargo-nono
        run: cargo binstall -y cargo-nono

      - name: Check no_std compatibility
        run: cargo nono

  semver-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check semver
        uses: obi1kenobi/cargo-semver-checks-action@v2
