[package]
name = "hipstr"
version = "0.9.0"
authors = ["Polazarus <polazarus@users.noreply.github.com>"]
description = """Yet another string for Rust: zero-cost borrow and slicing,
    inline representation for small strings, (atomic) reference counting"""
repository = "https://github.com/polazarus/hipstr"
keywords = ["string", "refcount", "inline", "arc_str", "cow"]
categories = ["memory-management", "data-structures"]
license = "MIT OR Apache-2.0"
edition = "2024"
readme = "README.md"
rust-version = "1.100.0"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std", "hip", "small", "tiny", "bytes", "str", "cstr", "osstr", "path"]
std = ["serde?/std"]
# representations
hip = []
small = []
tiny = []
# families (encodings)
bytes = []
str = []
cstr = []
osstr = ["std"]
path = ["osstr"]
unstable = []
# testing only: the loom model checker, with `RUSTFLAGS="--cfg loom"`
# (without the flag, the feature has no effect and builds nothing)
loom = ["dep:loom"]
serde = ["dep:serde"]
bstr = ["dep:bstr"]
borsh = ["dep:borsh"]

[dev-dependencies]
fastrand = "2.3.0"
serde_test = "1.0.177"
serde = { version = "1.0.155", default-features = false, features = [
    "derive",
    "alloc",
] }
serde_json = { version = "1.0.45", default-features = false, features = [
    "alloc",
] }
divan = "0.1.17"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[dependencies.const-default]
version = "1.0.0"
default-features = false

[dependencies.bstr]
version = "1.3"
optional = true
default-features = false
features = ["alloc"]

[dependencies.serde]
version = "1.0.155"
optional = true
default-features = false
features = ["alloc"]

[dependencies.borsh]
version = "1.5"
optional = true
default-features = false
features = []

[target.'cfg(loom)'.dependencies]
loom = { version = "0.7", optional = true }

[target.'cfg(not(loom))'.dev-dependencies]
arcstr = "1.2.0"
ecow = "0.2.3"
kstring = "2.0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(coverage)',
    'cfg(coverage_nightly)',
    'cfg(docsrs)',
    'cfg(loom)',
] }

[[bench]]
name = "main"
harness = false

[[bench]]
name = "repr"
harness = false
